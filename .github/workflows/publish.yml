name: Publish

# INERT until deliberately armed. The kernel is built OSS-ready (MIT + npmjs OIDC
# trusted publishing wired) but the repo is private and nothing has been
# published. It needs NO npm token: publishing authenticates via OIDC
# (npm >= 11.5.1 + a trusted publisher configured on npmjs for this repo).
#
# ARMING — read this before cutting a Release.
#
# "No Release exists yet" was the only thing standing between this workflow and
# a public npm publish of a PRIVATE codebase, and that is not a safety property,
# it is an absence. Creating a Release for ANY tag — including backfilling an
# old one to tidy up the tag list — would have published it, with the first
# mistake being the irreversible one (npm unpublish is refused once anything
# depends on the package).
#
# So the actuator now ships INERT, per the workspace `actuator-arming`
# convention: every gate, check and build below runs on a Release exactly as it
# always did, against real inputs, and the single mutating step is skipped
# unless the repo variable PUBLISH_LIVE is set to "true". A Release cut by
# accident produces a loud green no-op that tells you precisely what it would
# have published.
#
# To publish for real: `gh variable set PUBLISH_LIVE --body true --repo <repo>`,
# cut the Release, then UNSET it again. Arming is a separate, reversible act
# from releasing — never edit this file to publish. See issue #33 for the
# public-flip decision this gate exists to protect.
#
# Runner routing: runs on the self-hosted homelab via `vars.RUNNER_LABEL_BROKER || vars.RUNNER_LABEL`,
# matching test.yml and security.yml. The `|| 'ubuntu-latest'` fallback is
# load-bearing, not decoration: on the long-lived-runner path a job whose label
# resolves to no agent queues FOREVER with nothing red — for a publish that
# means a cut release silently never reaches npm. With the fallback a fleet
# outage degrades to a slower hosted run instead of a silent stall.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run without publishing"
        type: boolean
        default: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ${{ vars.RUNNER_LABEL_BROKER || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          # This job is pinned to `ubuntu-latest`, so today this expression
          # always evaluates to 'npm' and the behaviour is UNCHANGED. It is
          # written conditionally to pre-empt the open PR routing Publish to the
          # homelab: the moment `runs-on` becomes `vars.RUNNER_LABEL_BROKER || vars.RUNNER_LABEL`, restoring
          # the 735 MB npm cache over a ~25 Mbit link would add ~200s to the
          # release path for content that already sits in that host's ~/.npm.
          # See test.yml for the measurement.
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          # An empty `cache` alone is NOT enough. setup-node v7 falls through to
          # `package-manager-cache` (default TRUE), which auto-enables npm caching
          # whenever package.json declares `packageManager` or
          # `devEngines.packageManager` (src/main.ts L72-90, and the input's own
          # description). No package.json here declares either today -- checked --
          # so gating only `cache` would work by luck and would silently start
          # caching again the day anyone or Dependabot adds that field. Gate both.
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}
          registry-url: "https://registry.npmjs.org"

      # `npm install -g` is safe on the self-hosted runner: setup-node puts node
      # under the runner's own _work/_tool prefix (runner-owned, no sudo, not
      # /usr/local/bin). But that prefix PERSISTS between runs on a long-lived
      # agent, so the upgrade is guarded to be a no-op once satisfied rather
      # than re-mutating the shared tool cache on every publish. Behaviour on a
      # GitHub-hosted runner is unchanged (npm there is always older).
      - name: Ensure npm supports OIDC trusted publishing (>= 11.5.1)
        run: |
          set -euo pipefail
          have="$(npm --version)"
          if printf '%s\n%s\n' "11.5.1" "$have" | sort -V -C; then
            echo "npm $have already satisfies >= 11.5.1 — leaving it alone"
          else
            echo "npm $have is older than 11.5.1 — upgrading"
            npm install -g npm@latest
            echo "npm is now $(npm --version)"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify d.ts entry exports types
        run: |
          if [ ! -f dist/index.d.ts ]; then
            echo "::error::dist/index.d.ts is missing — the build emitted no types."
            exit 1
          fi
          if ! grep -q '^export' dist/index.d.ts; then
            echo "::error::dist/index.d.ts contains no exports — the public API is empty."
            exit 1
          fi
          DTS_LINES=$(wc -l < dist/index.d.ts)
          echo "::notice::dist/index.d.ts has $DTS_LINES lines of exports"

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Check version consistency
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version $PKG_VERSION is consistent"

      - name: Pack tarball
        run: |
          npm pack --ignore-scripts 2>/dev/null
          TARBALL=$(ls *.tgz)
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: true
        with:
          subject-path: ${{ env.TARBALL }}

      # The ONE mutating step, and the only one gated. Everything above runs
      # unarmed on purpose: an inert run that skipped the build would prove
      # nothing about the release it declined to make.
      - name: Publish package
        run: |
          set -euo pipefail
          DRY_RUN_INPUT="${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || 'false' }}"
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            echo "::notice::Dry run requested — not publishing"
            npm publish --dry-run
            exit 0
          fi
          if [ "${{ vars.PUBLISH_LIVE }}" != "true" ]; then
            echo "::warning::NOT ARMED — PUBLISH_LIVE is not 'true', so nothing was published."
            echo "This is the expected state. Everything above (typecheck, lint, test,"
            echo "build, .d.ts check, version consistency, provenance) ran for real."
            echo ""
            echo "What a live run would have published:"
            npm publish --dry-run
            echo ""
            echo "To publish: set the repo variable PUBLISH_LIVE=true, re-run, then UNSET it."
            exit 0
          fi
          echo "::notice::ARMED — publishing ${{ env.TARBALL }} via OIDC trusted publishing"
          npm publish
