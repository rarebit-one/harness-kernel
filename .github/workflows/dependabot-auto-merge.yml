name: Dependabot auto-merge

# Thin caller: delegates to the org-shared reusable auto-lander in
# rarebit-one/.github so the patch/minor auto-merge logic lives in one place.
# pull_request_target gives Dependabot the writable token it needs to enable
# auto-merge; the reusable guards on github.actor == 'dependabot[bot]'.
#
# Requires `allow_auto_merge` on the repo — without it the enable call is a
# silent no-op and every bump waits for a human.

on: pull_request_target

permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    uses: rarebit-one/.github/.github/workflows/dependabot-auto-merge.yml@main
    secrets: inherit
