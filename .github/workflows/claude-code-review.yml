name: Claude Code Review

# Automated review on every non-draft PR. Thin caller: the review logic (model,
# effort, prompt) lives once in the org-shared reusable so every repo reviews to
# the same bar.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: rarebit-one/.github/.github/workflows/claude-code-review.yml@main
    with:
      runner-label: ${{ vars.RUNNER_LABEL_BROKER || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    secrets: inherit
